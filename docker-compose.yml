services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-twitch_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to loopback only: local dev/tests need access, the network does not.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d ${POSTGRES_DB:-twitch_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build:
      context: .
      args:
        BOT_UID: ${BOT_UID:-1000}
        BOT_GID: ${BOT_GID:-1000}
    restart: unless-stopped
    env_file: .env
    environment:
      # Compose networking: the database is reachable at the service name.
      BOT_DATABASE__HOST: db
      BOT_DATABASE__USER: ${POSTGRES_USER:-bot}
      BOT_DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BOT_DATABASE__NAME: ${POSTGRES_DB:-twitch_bot}
    volumes:
      # Personas can be added/removed from the host without rebuilding.
      - ./personas:/app/personas:ro
      # Trivia category files (category_*.json) are supplied from the host.
      - ./trivia:/app/trivia:ro
      # AI request/reasoning/response logs are visible on the host.
      - ./logs:/app/logs
      # Generated HTML reports are written by the bot, so this mount is writable.
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    ports:
      # OAuth callback: reachable from the browser on the host.
      - "${BOT_TWITCH__OAUTH_PORT:-8080}:${BOT_TWITCH__OAUTH_PORT:-8080}"
    logging: *logging

volumes:
  pgdata:
